name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mods need Claude Code 2.1.287 or newer. Bump this on purpose.
      CLAUDE_CODE_VERSION: 2.1.288
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Check every band mod's copy of the band helper
        run: node --test test/*.test.mjs

      - name: Validate and test each mod
        run: |
          # A mod is any folder under mods/ with a tracked plugin.json.
          mods=$(git ls-files 'mods/*/.claude-plugin/plugin.json' | cut -d/ -f2 | sort -u)
          if [ -z "$mods" ]; then
            echo "::error::No mods found under mods/"
            exit 1
          fi
          failed=""
          for mod in $mods; do
            echo "::group::$mod"
            # A mod that needs a newer Claude Code than the pinned minimum names it in
            # mods/<name>/.claude-code-version and is checked with that version.
            cc="claude"
            if [ -f "mods/$mod/.claude-code-version" ]; then
              v=$(tr -d '[:space:]' < "mods/$mod/.claude-code-version")
              if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                failed="$failed $mod(.claude-code-version)"
                echo "::endgroup::"
                continue
              fi
              cc="npx -y @anthropic-ai/claude-code@$v"
              echo "$mod needs Claude Code $v"
            fi
            if ! $cc plugin validate "mods/$mod"; then
              failed="$failed $mod(validate)"
            fi
            if [ -d "mods/$mod/tests" ] && ! $cc plugin test "mods/$mod"; then
              failed="$failed $mod(test)"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
          echo "All mods passed."

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18

      - name: Test the CLI
        run: node --test

      - name: Check the package contents
        run: npm pack --dry-run
