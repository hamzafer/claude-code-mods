name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mods:
    runs-on: ubuntu-latest
    env:
      # Mods need Claude Code 2.1.287 or newer. Bump this on purpose.
      CLAUDE_CODE_VERSION: 2.1.288
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate and test each mod
        run: |
          failed=""
          for mod in $(git ls-files mods | cut -d/ -f2 | sort -u); do
            echo "::group::$mod"
            if ! claude plugin validate "mods/$mod"; then
              failed="$failed $mod(validate)"
            fi
            if [ -d "mods/$mod/tests" ] && ! claude plugin test "mods/$mod"; then
              failed="$failed $mod(test)"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
          echo "All mods passed."
