name: Repo guard

# Reads main's rules and the npm environment and fails if they drifted. Read-only token.
on:
  schedule:
    - cron: '17 6 * * *' # daily
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
      - test/repo-settings.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to read the npm environment

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check repo settings
        run: node test/repo-settings.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
